# Optional: Add to Home Assistant deployment if you want separation
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["mongodb", "kafka"]
              topologyKey: kubernetes.io/hostname