# Home Assistant - IoT Dashboard and Automation Hub
# CS5287 CA2 - Standalone Home Assistant deployment
# 
# This complements the Ansible-deployed core plant monitoring system

---
# Home Assistant Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: plant-monitoring
  labels:
    app: homeassistant
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        component: dashboard
    spec:
      containers:
      - name: homeassistant
        image: homeassistant/home-assistant:2024.1.0
        ports:
        - containerPort: 8123
          name: http
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: homeassistant-config
              key: TZ
        volumeMounts:
        - name: config
          mountPath: /config
        - name: ha-config-files
          mountPath: /config/configuration.yaml
          subPath: configuration.yaml
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 120
          periodSeconds: 60
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: mosquitto
        image: eclipse-mosquitto:2.0.18
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 9001
          name: websockets
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config
        - name: mosquitto-data
          mountPath: /mosquitto/data
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homeassistant-config-pvc
      - name: ha-config-files
        configMap:
          name: homeassistant-configuration
      - name: mosquitto-config
        configMap:
          name: mosquitto-configuration
      - name: mosquitto-data
        persistentVolumeClaim:
          claimName: mosquitto-data-pvc

---
# Home Assistant Service
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-service
  namespace: plant-monitoring
  labels:
    app: homeassistant
    component: dashboard
spec:
  selector:
    app: homeassistant
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: websockets
    port: 9001
    targetPort: 9001
  type: ClusterIP

---
# Home Assistant Configuration PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-pvc
  namespace: plant-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp2

---
# Mosquitto Data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data-pvc
  namespace: plant-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: gp2

---
# Home Assistant Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-configuration
  namespace: plant-monitoring
data:
  configuration.yaml: |
    default_config:
    
    # Basic configuration
    homeassistant:
      name: Plant Monitoring System
      latitude: 39.7392
      longitude: -104.9903
      elevation: 1655
      unit_system: metric
      time_zone: America/Denver
      
    # Enable frontend
    frontend:
    
    # Enable configuration UI
    config:
    
    # HTTP server configuration
    http:
      server_port: 8123
      
    # MQTT Integration
    mqtt:
      broker: localhost
      port: 1883
      discovery: true
      discovery_prefix: homeassistant
      
    # Automation for plant care
    automation: !include automations.yaml
    
    # Plant sensors (auto-discovered via MQTT)
    sensor: []
    
    # Logger configuration  
    logger:
      default: info
      logs:
        homeassistant.components.mqtt: debug

  automations.yaml: |
    # Plant Care Automations
    - alias: "Plant Needs Water Alert"
      trigger:
        - platform: numeric_state
          entity_id: sensor.plant_001_moisture
          below: 30
      action:
        - service: notify.persistent_notification
          data:
            title: "🌱 Plant Alert"
            message: "Plant 001 (Monstera) needs watering! Moisture: {{ states('sensor.plant_001_moisture') }}%"
            
    - alias: "Plant Overwatered Alert"  
      trigger:
        - platform: numeric_state
          entity_id: sensor.plant_001_moisture
          above: 80
      action:
        - service: notify.persistent_notification
          data:
            title: "🌱 Plant Alert"
            message: "Plant 001 (Monstera) may be overwatered! Moisture: {{ states('sensor.plant_001_moisture') }}%"

---
# Mosquitto Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-configuration
  namespace: plant-monitoring
data:
  mosquitto.conf: |
    # Mosquitto configuration for Plant Monitoring System
    
    # Network
    listener 1883 0.0.0.0
    protocol mqtt
    
    # WebSocket listener for browser clients
    listener 9001 0.0.0.0
    protocol websockets
    
    # Security (allow anonymous for demo)
    allow_anonymous true
    
    # Persistence
    persistence true
    persistence_location /mosquitto/data/
    
    # Logging
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information
    
    # Connection logging
    connection_messages true
    log_timestamp true