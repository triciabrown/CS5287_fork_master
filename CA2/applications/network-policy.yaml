# Network Security Policies
# Restrict traffic between services for better security

---
# Default Deny All Traffic in plant-monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: plant-monitoring
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Allow MongoDB Internal Traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-policy
  namespace: plant-monitoring
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: plant-data-processor
    ports:
    - protocol: TCP
      port: 27017
  egress:
  - {} # Allow all egress for DNS resolution

---
# Allow Kafka Internal Traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-policy
  namespace: plant-monitoring
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: plant-data-processor
    - podSelector:
        matchLabels:
          app: plant-producer
    ports:
    - protocol: TCP
      port: 9092
  - from:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9093
  egress:
  - {} # Allow all egress

---
# Allow Producer to Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: producer-policy
  namespace: plant-monitoring
spec:
  podSelector:
    matchLabels:
      app: plant-producer
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - {} # Allow DNS and other egress

---
# Allow Processor to MongoDB and Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: processor-policy
  namespace: plant-monitoring
spec:
  podSelector:
    matchLabels:
      app: plant-data-processor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: system-monitor
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - {} # Allow DNS and other egress

---
# Allow System Monitor Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-policy
  namespace: plant-monitoring
spec:
  podSelector:
    matchLabels:
      app: system-monitor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: plant-data-processor
    ports:
    - protocol: TCP
      port: 8080
  - {} # Allow DNS and other egress