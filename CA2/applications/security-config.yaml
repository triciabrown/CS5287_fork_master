---
# Kafka Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: plant-monitoring
data:
  KAFKA_BROKERS: "kafka-service:9092"
  KAFKA_ADVERTISED_HOST: "kafka-service"
  KAFKA_ADVERTISED_PORT: "9092"
  # Topics
  KAFKA_SENSOR_TOPIC: "plant-sensors"
  KAFKA_ALERT_TOPIC: "plant-alerts" 
  KAFKA_ACTION_TOPIC: "plant-actions"
  KAFKA_CONSUMER_GROUP: "plant-processor-group"
  KAFKA_REPLICATION_FACTOR: "1"
  KAFKA_PARTITIONS: "3"
  KAFKA_AUTO_CREATE_TOPICS: "true"

---
# MongoDB Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: plant-monitoring
data:
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_DATABASE: "plant_monitoring"

---
# Home Assistant Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-config
  namespace: plant-monitoring
data:
  TZ: "UTC"
  # MQTT broker settings
  MQTT_HOST: "homeassistant-service"
  MQTT_PORT: "1883"
  MQTT_DISCOVERY_PREFIX: "homeassistant"
  # Plant monitoring settings
  PLANT_COUNT: "2"
  PLANT_001_TYPE: "monstera"
  PLANT_001_LOCATION: "Living Room"
  PLANT_002_TYPE: "sansevieria"
  PLANT_002_LOCATION: "Bedroom"

---
# Plant Sensor Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: plant-sensor-config
  namespace: plant-monitoring
data:
  # Sensor simulation settings
  SENSOR_INTERVAL: "30"
  KAFKA_BROKERS: "kafka-service:9092"
  KAFKA_TOPIC: "plant-sensors"
  # Plant profiles
  MONSTERA_MOISTURE_MIN: "40"
  MONSTERA_MOISTURE_MAX: "60"
  MONSTERA_LIGHT_MIN: "800"
  SANSEVIERIA_MOISTURE_MIN: "20" 
  SANSEVIERIA_MOISTURE_MAX: "40"
  SANSEVIERIA_LIGHT_MIN: "200"

---
# Application Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: plant-monitoring
data:
  # Processor settings
  MONGO_DATABASE: "plant_monitoring"
  PROCESSOR_INTERVAL: "10"
  HEALTH_CHECK_INTERVAL: "60"
  
  # MQTT Integration
  MQTT_BROKER: "homeassistant-service:1883"
  MQTT_DISCOVERY_PREFIX: "homeassistant"
  MQTT_CLIENT_ID: "plant-processor"
  
  # Logging and monitoring
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
  HEALTH_CHECK_PORT: "8080"